name: Vitortho Feed Updater

# Vitortho's eigen feed, met de voorraad uit hun B2B (zie scraper.py).
# Stock Sync leest "NOW | Vitortho" om 04:00 NL. GitHub start geplande runs tot 6 uur te
# laat (gemeten 01-05/10: 23:15 UTC liep om 02:00-02:41, 11:15 om 15:08-17:21). Dus vroeg:
# 19:37 UTC (21:37 NL zomer) is ook met 6 uur vertraging vóór 04:00 NL klaar; 09:37 UTC
# ververst overdag. Op :37 en niet op het hele uur: dan is GitHub het drukst.

# 05-10: van 02-10 tot 05-10 gepauzeerd (inloggen mislukte; nieuw wachtwoord door Max in
# het secret gezet). Mislukt het inloggen weer: pauzeer opnieuw, want te veel mislukte
# pogingen kunnen het account blokkeren.
on:
  schedule:
    - cron: "37 19 * * *"
    - cron: "37 9 * * *"
  workflow_dispatch:
  # Een codewijziging draait meteen één keer, zodat hij direct bewezen is. De
  # bot-commits raken alleen de xml/csv en starten dus geen nieuwe run.
  push:
    branches: [main]
    paths: ["scraper.py", "requirements.txt", ".github/workflows/update_feed.yml"]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies installeren
        run: pip install -r requirements.txt
      - name: Tests
        run: pip install pytest && python -m pytest -q test_feed.py
      - name: Scraper draaien
        env:
          VITORTHO_GEBRUIKER: ${{ secrets.VITORTHO_GEBRUIKER }}
          VITORTHO_WACHTWOORD: ${{ secrets.VITORTHO_WACHTWOORD }}
        run: python scraper.py
      - name: XML committen en pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vitortho_feed.xml vitortho_verschillen.csv
          git diff --staged --quiet || git commit -m "🔄 Feed bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
